# Apollo Cloud — compila e EMPACOTA o instalador Windows do cliente branded.
# Diferente do windows-build-and-test.yml oficial (que só compila+testa em PR),
# este roda sob demanda (workflow_dispatch) e no push da branch apollo-brand,
# gera o instalador via Craft (NullsoftInstallerPackager) e publica como artefato.
name: Apollo Cloud - Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [apollo-brand]
jobs:
  build:
    name: Build & Package (Windows)
    runs-on: windows-2022
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Craft + client deps
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|stable-34.0|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|stable-34.0|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Install Inkscape (icon rasterization)
        shell: pwsh
        run: choco install inkscape -y --no-progress

      - name: Compile
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          craft --src-dir ${{ github.workspace }} nextcloud-client

      - name: Patch upstream blueprint (import os + marca Apollo)
        shell: pwsh
        run: |
          # (1) Bug upstream em craft-blueprints-nextcloud@stable-34.0: nextcloud-client.py
          #     usa os.path.join em createPackage() sem 'import os' -> NameError.
          # (2) appname/company do blueprint ainda sao Nextcloud -> Apollo.
          $bp = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"
          if (-not (Test-Path $bp)) { Write-Host "[apollo] AVISO: blueprint nao encontrado em $bp"; exit 1 }
          $c = Get-Content $bp -Raw
          if ($c -notmatch '(?m)^import os\b') { $c = "import os`r`n" + $c; Write-Host "[apollo] +import os" }
          $c = $c -replace '(?m)(self\.defines\["appname"\]\s*=\s*)"nextcloud"', '$1"apollocloud"'
          $c = $c -replace '(?m)(self\.defines\["company"\]\s*=\s*)"Nextcloud GmbH"', '$1"Apollo Solution"'
          Set-Content $bp $c -Encoding utf8 -NoNewline
          Write-Host "[apollo] blueprint patchado (import os, appname=apollocloud, company=Apollo Solution)"

      - name: Package installer
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          craft --package nextcloud-client

      - name: Collect installer
        shell: pwsh
        run: |
          $dest = "${{ github.workspace }}\_dist"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # O instalador tem dezenas de MB; os utilitarios do Craft sao < 1 MB.
          $inst = Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Include *.exe,*.msi -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 5MB -and $_.FullName -notmatch '\\work\\build\\|\\bin\\' } |
            Sort-Object Length -Descending
          if (-not $inst) {
            Write-Host "Nenhum instalador (> 5MB) encontrado; diagnostico:"
            Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Include *.exe,*.msi -ErrorAction SilentlyContinue |
              Sort-Object Length -Descending | Select-Object -First 10 FullName, Length
            exit 1
          }
          $main = $inst[0]
          $target = Join-Path $dest ("ApolloCloud-Setup-x64" + $main.Extension)
          Copy-Item $main.FullName -Destination $target -Force
          Write-Host ("instalador: " + $main.Name + " (" + [math]::Round($main.Length/1MB,1) + " MB) -> " + (Split-Path $target -Leaf))

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-cloud-windows-installer
          path: ${{ github.workspace }}\_dist\**
          if-no-files-found: warn
