# SPDX-License-Identifier: GPL-2.0-or-later
# Apollo Cloud — compila e EMPACOTA o app macOS (Apple Silicon) do cliente branded.
# Espelho do apollo-release.yml (Windows): roda sob demanda (workflow_dispatch) e
# no push da branch apollo-brand; publica o .dmg como artefato.
#
# Empacotamento: NAO usamos `craft --package` no mac — o CollectionPackager do
# Craft monta o archive a partir dos images das dependencias e perde o bundle do
# cliente (o image dele replica o prefixo absoluto de instalacao) -> sobra uma
# casca sem Info.plist -> codesign "bundle format unrecognized". Como o proprio
# build ja roda macdeployqt em POST_BUILD (src/gui/CMakeLists.txt:784), o bundle
# que o install deixa no image e AUTOCONTIDO (Qt + QML + plugins + ad-hoc sign).
# Basta: verificar -> re-sign ad-hoc -> hdiutil.
#
# SEM Developer ID/notarizacao por enquanto: Gatekeeper pede clique-direito >
# Abrir no 1o uso (pendencia E3 no ApolloPlan).
name: Apollo Cloud - macOS App
on:
  workflow_dispatch:
  push:
    branches: [apollo-brand]
jobs:
  build:
    name: Build & Package (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CRAFT_TARGET: macos-clang-arm64
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}/CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}/craftmaster.ini
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16.3
        run: |
          # mesmo Xcode que o macos-craft-ci.yml do upstream usa nesta branch;
          # se a imagem do runner nao tiver, segue com o default dela.
          ls -1 /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer \
            || echo "[apollo] Xcode 16.3 ausente; usando o default do runner"
          xcodebuild -version

      - uses: actions/setup-python@v5
        with:
          # precisa casar com Paths/Python do [macos-clang-arm64] no craftmaster.ini
          python-version: '3.12.3'

      - name: Install Inkscape (icon rasterization)
        run: brew install homebrew/cask/inkscape

      - name: Install Craft + client deps
        run: |
          git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git "$CRAFT_MASTER_LOCATION"
          craft() {
            python "$CRAFT_MASTER_LOCATION/CraftMaster.py" --config "$CRAFT_MASTER_CONFIG" --target "$CRAFT_TARGET" -c "$@"
          }
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|stable-34.0|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|stable-34.0|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Compile
        run: |
          craft() {
            python "$CRAFT_MASTER_LOCATION/CraftMaster.py" --config "$CRAFT_MASTER_CONFIG" --target "$CRAFT_TARGET" -c "$@"
          }
          # File Provider (arquivos sob demanda) exige assinatura Apple -> fora por ora;
          # motor de sync classico, igual ao build Windows.
          craft --options nextcloud-client.buildFileProviderModule=False --src-dir "$GITHUB_WORKSPACE" nextcloud-client

      - name: Package (.dmg direto do bundle do image)
        run: |
          APP=$(find "$GITHUB_WORKSPACE/$CRAFT_TARGET/build/nextcloud-client" -maxdepth 12 -type d -name "Apollo Cloud.app" -path "*image-*" | head -1)
          if [ -z "$APP" ]; then echo "[apollo] bundle nao encontrado no image"; exit 1; fi
          echo "== bundle: $APP"
          plutil -p "$APP/Contents/Info.plist" | head -12
          echo "== smoke test (apollocloudcmd --version):"
          "$APP/Contents/MacOS/apollocloudcmd" --version || echo "[apollo] AVISO: apollocloudcmd --version falhou (exit $?)"
          echo "== re-sign ad-hoc (belt & braces; macdeployqt ja assinou):"
          codesign -s - -f --deep --preserve-metadata=identifier,entitlements "$APP" \
            || echo "[apollo] AVISO: re-sign falhou; mantendo assinatura do macdeployqt"
          echo "== verificacao estrita (gate):"
          codesign -vvv --deep --strict "$APP"
          STAGE="$GITHUB_WORKSPACE/_stage"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/Apollo Cloud.app"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p "$GITHUB_WORKSPACE/_dist"
          hdiutil create -volname "ApolloDrive" -srcfolder "$STAGE" -ov -format UDZO "$GITHUB_WORKSPACE/_dist/ApolloDrive-macOS.dmg"
          ls -lh "$GITHUB_WORKSPACE/_dist"

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-cloud-macos-app
          path: ${{ github.workspace }}/_dist/**
          if-no-files-found: warn

      - name: Upload craft logs (diagnostico)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: craft-logs
          path: ${{ github.workspace }}/${{ env.CRAFT_TARGET }}/logs/**
          if-no-files-found: warn
